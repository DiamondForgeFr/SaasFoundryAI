name: Deploy Documentation

# Manual only, deliberately — see #624.
#
# This used to fire on every push to `master` and on every `v*` tag, which meant the v1 cut
# would have triggered it. It has never run: GitHub Pages is not enabled on this repository
# (`gh api repos/DiamondForgeFr/SaasFoundryAI/pages` returns 404), so `actions/deploy-pages`
# could only have failed, and it would have failed inside the release rather than somewhere
# a failure is cheap.
#
# Enabling Pages is a manual, owner-only step: Settings -> Pages -> Source -> "GitHub
# Actions". Once that is done and one `workflow_dispatch` run has been seen to succeed,
# restore the `push` block below and delete this comment.
#
#  push:
#    branches: [master]
#    tags: ['v*']
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git-based features

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
