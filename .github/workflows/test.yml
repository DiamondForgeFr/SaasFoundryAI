name: Tests

on:
  push:
    branches: [master, develop, 'rc-*']
    tags: ['rc-*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [master, develop]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:check
      - run: npm run lint

  docs:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  coverage:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --coverage --coverageReporters=lcov --coverageReporters=text-summary
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lifecycle_prepare:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/rc-') || startsWith(github.ref, 'refs/tags/rc-')))
    name: Prepare lifecycle image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.lane.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: lane
        name: Resolve lifecycle lane
        shell: bash
        run: |
          lane=full
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then lane=normal; fi
          echo "matrix={\"include\":$(npx tsx tests/docker/list-scenarios.ts --json --lane "$lane")}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build lifecycle image once
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          tags: sf-test:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/sf-test.tar
          cache-from: type=gha,scope=lifecycle-image
          cache-to: type=gha,mode=max,scope=lifecycle-image
      - name: Upload lifecycle image
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sf-test.tar
          compression-level: 0
          retention-days: 1

  lifecycle:
    needs: lifecycle_prepare
    if: needs.lifecycle_prepare.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lifecycle_prepare.outputs.matrix) }}
    steps:
      - name: Download lifecycle image
        uses: actions/download-artifact@v4
        with:
          name: lifecycle-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle-image
      - name: Load lifecycle image
        run: docker load --input "${{ runner.temp }}/lifecycle-image/sf-test.tar"
      - name: Run lifecycle
        shell: bash
        run: |
          artifacts="${{ runner.temp }}/lifecycle-artifacts"
          mkdir -p "$artifacts"
          docker run --rm --init --ipc=host \
            -e "TEST_SCENARIO=${{ matrix.scenario }}" \
            -e "TEST_LIVE_DEPTH=${{ matrix.depth }}" \
            -e "SF_TEST_ARTIFACTS_DIR=/artifacts" \
            --mount "type=bind,source=$artifacts,target=/artifacts" \
            "sf-test:${{ github.sha }}"
      - name: Normalize lifecycle artifact ownership
        if: always()
        run: |
          artifacts="${{ runner.temp }}/lifecycle-artifacts"
          docker run --rm --entrypoint chown \
            --mount "type=bind,source=$artifacts,target=/artifacts" \
            "sf-test:${{ github.sha }}" -R "$(id -u):$(id -g)" /artifacts
      - name: Verify timing evidence
        if: always()
        run: test -s "${{ runner.temp }}/lifecycle-artifacts/timings/${{ matrix.scenario }}.json"
      - name: Upload lifecycle timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-timing-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.check }}
          path: ${{ runner.temp }}/lifecycle-artifacts/timings
          retention-days: 14
      - name: Upload lifecycle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.check }}
          path: ${{ runner.temp }}/lifecycle-artifacts
          retention-days: 7
