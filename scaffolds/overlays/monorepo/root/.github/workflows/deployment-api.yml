name: Deployment API

on:
  push:
    branches: [{{MAIN_BRANCH}}]
    paths:
      - 'apps/api/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.0)'
        required: true
        type: string
        default: 'latest'
  repository_dispatch:
    types:
      - deployment-api

jobs:
  check-tests:
    name: Check if tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Check test status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Check if tests have passed for this specific commit
            gh run list --workflow=test.yml --branch={{MAIN_BRANCH}} --status=success --limit=1 --commit=${{ github.sha }}
            if [ $? -ne 0 ]; then
              echo "Tests have not passed for commit ${{ github.sha }}. Deployment blocked."
              exit 1
            fi
          fi

      - name: Print last failed test run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Last 5 test runs:"
          gh run list --workflow=test.yml --limit=5
          echo "Detailed logs of the last failed run:"
          LAST_FAILED_RUN=$(gh run list --workflow=test.yml --status=failure --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ ! -z "$LAST_FAILED_RUN" ]; then
            gh run view $LAST_FAILED_RUN --log
          fi

  create-version-tag:
    name: Create version tag based on package.json
    needs: check-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./apps/api/package.json').version")
          echo "Version from apps/api/package.json: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for version bump in commit message
        id: check-is-version-bump
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Get last commit message
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Last commit message: $COMMIT_MSG"

            # Check for version bump commit
            if [[ "$COMMIT_MSG" =~ chore:\ bump\ version\ to ]]; then
              echo "Version bump commit detected: $COMMIT_MSG"
              echo "is_version_bump=true" >> $GITHUB_OUTPUT
            else
              echo "No version bump detected in commit message"
              echo "is_version_bump=false" >> $GITHUB_OUTPUT
            fi
          else
            # For workflow_dispatch and repository_dispatch
            echo "Not a push event, skipping tag creation"
            echo "is_version_bump=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if version tag exists
        id: check-tag
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true'
        run: |
          TAG_EXISTS=$(git tag -l "api-v${{ steps.package-version.outputs.version }}")
          if [ -z "$TAG_EXISTS" ]; then
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag api-v${{ steps.package-version.outputs.version }} does not exist, will create it"
          else
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag api-v${{ steps.package-version.outputs.version }} already exists"
          fi

      - name: Set Git user
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Create tag if it doesn't exist
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true' && steps.check-tag.outputs.tag_exists == 'false'
        run: |
          git tag -a "api-v${{ steps.package-version.outputs.version }}" -m "API release version ${{ steps.package-version.outputs.version }}"
          echo "Created tag api-v${{ steps.package-version.outputs.version }}"

      - name: Push current {{MAIN_BRANCH}} to tag
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true'
        run: |
          if [ "${{ steps.check-tag.outputs.tag_exists }}" == "true" ]; then
            git push origin HEAD:refs/tags/api-v${{ steps.package-version.outputs.version }} -f
            echo "Updated existing tag api-v${{ steps.package-version.outputs.version }} with current {{MAIN_BRANCH}}"
          else
            git push origin "api-v${{ steps.package-version.outputs.version }}"
            echo "Pushed new tag api-v${{ steps.package-version.outputs.version }}"
          fi

  docker-push:
    name: Push Docker image to GHCR
    needs: [check-tests, create-version-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Always get package version directly from package.json to ensure consistency
      - name: Get package version directly
        id: package-version
        run: |
          PKG_VERSION=$(node -p "require('./apps/api/package.json').version")
          echo "Version from apps/api/package.json: $PKG_VERSION"
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=${{ steps.package-version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Show tags before push
        run: |
          echo "Tags that will be applied:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Current images and their tags:"
          docker images ghcr.io/${{ github.repository }}/api --format "{{.ID}} {{.Repository}}:{{.Tag}}"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show tags after push
        run: |
          echo "Images and their tags after push:"
          docker images ghcr.io/${{ github.repository }}/api --format "{{.ID}} {{.Tag}}"

  deploy:
    name: Deploy to the Docker host
    needs: [docker-push]
    # Skipped until the DEPLOY_HOST repository variable is set. Repository variables:
    # DEPLOY_HOST, DEPLOY_USER, DEPLOY_PORT (default 22), DEPLOY_API_PATH, DEPLOY_KNOWN_HOSTS
    # (`ssh-keyscan -p <port> <host>`). Secret: DEPLOY_SSH_KEY, plus the application secrets the .env step reads.
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_API_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./apps/api/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured: see the deploy job's header in this workflow"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned: an unknown or changed key aborts the deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload the compose file and the environment
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET_AUTH: ${{ secrets.JWT_SECRET_AUTH }}
          JWT_SECRET_REFRESH: ${{ secrets.JWT_SECRET_REFRESH }}
          JWT_SECRET_CONFIRM_ACCOUNT: ${{ secrets.JWT_SECRET_CONFIRM_ACCOUNT }}
          JWT_SECRET_RESET_PASSWORD: ${{ secrets.JWT_SECRET_RESET_PASSWORD }}
          JWT_SECRET_INVITATION: ${{ secrets.JWT_SECRET_INVITATION }}
          # MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
        run: |
          set -euo pipefail
          ssh deploy-target "mkdir -p '$DEPLOY_PATH'"
          scp -q apps/api/docker-compose.yml "deploy-target:$DEPLOY_PATH/docker-compose.yml"

          # Single-quoted values: compose reads them literally, without interpolating `$`.
          # LOG_DIR is left to the image, which owns /app/logs.
          env_line() { printf "%s='%s'\n" "$1" "$2"; }
          {
            env_line PORT "3500"
            env_line NODE_ENV "production"
            env_line FRONTEND_URL "$FRONTEND_URL"
            env_line DATABASE_URL "$DATABASE_URL"
            env_line DIRECT_URL "$DIRECT_URL"
            env_line API_PREFIX "/api"
            env_line JWT_AUTH_EXPIRES_IN "15m"
            env_line JWT_REFRESH_EXPIRES_IN "7d"
            env_line JWT_CREATE_ACCOUNT_EXPIRES_IN "24h"
            env_line JWT_RESET_PASSWORD_EXPIRES_IN "1h"
            env_line JWT_INVITATION_EXPIRES_IN "7d"
            env_line JWT_SECRET_AUTH "$JWT_SECRET_AUTH"
            env_line JWT_SECRET_REFRESH "$JWT_SECRET_REFRESH"
            env_line JWT_SECRET_CONFIRM_ACCOUNT "$JWT_SECRET_CONFIRM_ACCOUNT"
            env_line JWT_SECRET_RESET_PASSWORD "$JWT_SECRET_RESET_PASSWORD"
            env_line JWT_SECRET_INVITATION "$JWT_SECRET_INVITATION"
            # env_line MAILERSEND_API_KEY "$MAILERSEND_API_KEY"
            # env_line MAILERSEND_SENDER_EMAIL ''
            # env_line MAILERSEND_SENDER_NAME ''
            env_line LOG_LEVEL "info"
          } | ssh deploy-target "umask 077 && cat > '$DEPLOY_PATH/.env'"

      - name: Deploy the new image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/api
          VERSION: ${{ steps.package-version.outputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):$VERSION"
          echo "Deploying $IMAGE to $DEPLOY_HOST:$DEPLOY_PATH"
          # The job token is only valid while this job runs; the host logs out right after
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target "docker login ghcr.io -u '$GHCR_USER' --password-stdin" >/dev/null
          ssh deploy-target sh -s -- "$DEPLOY_PATH" "$IMAGE" <<'REMOTE'
          set -eu
          cd "$1"
          export API_IMAGE="$2"
          docker network inspect saasfoundry-network >/dev/null 2>&1 || docker network create saasfoundry-network >/dev/null
          docker compose pull backend
          # Forward-only: brings the schema and prisma/sql up to date, never resets the database.
          # stdin closed: this script arrives on stdin, and `run` would swallow the rest of it
          docker compose run --rm --no-deps -T backend npm run db:update </dev/null
          docker compose up -d --no-build backend
          for attempt in $(seq 1 24); do
            status=$(docker inspect -f '{{.State.Health.Status}}' saasfoundry-api)
            if [ "$status" = healthy ]; then
              echo "saasfoundry-api is healthy"
              docker image prune -f >/dev/null
              exit 0
            fi
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker compose logs --tail 100 backend
          echo "saasfoundry-api did not become healthy" >&2
          exit 1
          REMOTE

      - name: Log the host out of the registry
        if: always()
        run: ssh deploy-target "docker logout ghcr.io" >/dev/null 2>&1 || true
