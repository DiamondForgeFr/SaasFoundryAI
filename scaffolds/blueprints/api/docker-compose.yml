name: saasfoundry-api
services:
  ###############
  # Backend API #
  ###############
  backend:
    # The deployment workflow sets API_IMAGE to the published image; locally, `docker compose build` tags this name
    image: ${API_IMAGE:-saasfoundry-api}
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: saasfoundry-api
    env_file:
      - ./.env
    # Loopback only: the web container reaches the API over the network, not through this port
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3500}:3500'
    # A named volume takes the ownership of the image's /app/logs; a host directory would be root-owned
    volumes:
      - api-logs:/app/logs
    restart: unless-stopped
    networks:
      - saasfoundry-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3500/api/health']
      interval: 30s
      timeout: 3s
      retries: 1
      start_period: 30s

volumes:
  api-logs:

networks:
  saasfoundry-network:
    external: true
