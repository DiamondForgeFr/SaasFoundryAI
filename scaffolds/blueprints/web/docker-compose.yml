name: saasfoundry-web
services:
  ################
  # Frontend App #
  ################
  frontend:
    # The deployment workflow sets WEB_IMAGE to the published image; locally, `docker compose build` tags this name
    image: ${WEB_IMAGE:-saasfoundry-web}
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: saasfoundry-web
    ports:
      - '${FRONTEND_PORT:-3000}:8080'
    # nginx logs go to the container output (`docker compose logs`); only its configuration is mounted
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - saasfoundry-network

networks:
  saasfoundry-network:
    external: true # Assuming backend creates this network
