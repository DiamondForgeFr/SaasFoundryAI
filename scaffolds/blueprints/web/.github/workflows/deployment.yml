name: Deployment

on:
  push:
    branches: [{{MAIN_BRANCH}}]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.0)'
        required: true
        type: string
        default: 'latest'
  repository_dispatch:
    types:
      - deployment

jobs:
  check-tests:
    name: Wait for the tests of this commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      # The Tests workflow starts on the same push: the deploy waits for its verdict on this
      # commit instead of looking once and finding nothing (#889). A dispatch deploys on demand.
      - name: Wait for Tests to succeed on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            run=$(gh run list --workflow test.yml --event push --commit "$COMMIT_SHA" --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = "completed" ]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              if [ "$conclusion" = "success" ]; then
                echo "Tests passed on $COMMIT_SHA: $(jq -r .url <<<"$run")"
                exit 0
              fi
              echo "Tests concluded '$conclusion' on $COMMIT_SHA ($(jq -r .url <<<"$run")): deployment blocked." >&2
              exit 1
            fi
            sleep 30
          done
          echo "No completed Tests run on $COMMIT_SHA within 40 minutes: deployment blocked." >&2
          exit 1

  create-version-tag:
    name: Create version tag based on package.json
    needs: check-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Version from package.json: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for version bump in commit message
        id: check-is-version-bump
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Get last commit message
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Last commit message: $COMMIT_MSG"

            # Check for version bump commit
            if [[ "$COMMIT_MSG" =~ chore:\ bump\ version\ to ]]; then
              echo "✅ Version bump commit detected: $COMMIT_MSG"
              echo "is_version_bump=true" >> $GITHUB_OUTPUT
            else
              echo "No version bump detected in commit message"
              echo "is_version_bump=false" >> $GITHUB_OUTPUT
            fi
          else
            # For workflow_dispatch and repository_dispatch
            echo "Not a push event, skipping tag creation"
            echo "is_version_bump=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if version tag exists
        id: check-tag
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true'
        run: |
          TAG_EXISTS=$(git tag -l "v${{ steps.package-version.outputs.version }}")
          if [ -z "$TAG_EXISTS" ]; then
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.package-version.outputs.version }} does not exist, will create it"
          else
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.package-version.outputs.version }} already exists"
          fi

      - name: Set Git user
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Create tag if it doesn't exist
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true' && steps.check-tag.outputs.tag_exists == 'false'
        run: |
          git tag -a "v${{ steps.package-version.outputs.version }}" -m "Release version ${{ steps.package-version.outputs.version }}"
          echo "Created tag v${{ steps.package-version.outputs.version }}"

      - name: Push current {{MAIN_BRANCH}} to tag
        if: steps.check-is-version-bump.outputs.is_version_bump == 'true'
        run: |
          if [ "${{ steps.check-tag.outputs.tag_exists }}" == "true" ]; then
            git push origin HEAD:refs/tags/v${{ steps.package-version.outputs.version }} -f
            echo "Updated existing tag v${{ steps.package-version.outputs.version }} with current {{MAIN_BRANCH}}"
          else
            git push origin "v${{ steps.package-version.outputs.version }}"
            echo "Pushed new tag v${{ steps.package-version.outputs.version }}"
          fi

  docker-push:
    name: Push Docker image to GHCR
    needs: [check-tests, create-version-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Always get package version directly from package.json to ensure consistency
      - name: Get package version directly
        id: package-version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Version from package.json: $PKG_VERSION"
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.package-version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Show tags before push
        run: |
          echo "Tags that will be applied:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Current images and their tags:"
          docker images ghcr.io/${{ github.repository }} --format "{{.ID}} {{.Repository}}:{{.Tag}}"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show tags after push
        run: |
          echo "Images and their tags after push:"
          docker images ghcr.io/${{ github.repository }} --format "{{.ID}} {{.Tag}}"

  deploy:
    name: Deploy to the Docker host
    needs: [docker-push]
    # Skipped until the DEPLOY_HOST repository variable is set. Repository variables:
    # DEPLOY_HOST, DEPLOY_USER, DEPLOY_PORT (default 22), DEPLOY_WEB_PATH, DEPLOY_KNOWN_HOSTS
    # (`ssh-keyscan -p <port> <host>`), DEPLOY_WEB_PORT (default 3000). Secret: DEPLOY_SSH_KEY.
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_WEB_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured: see the deploy job's header in this workflow"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned: an unknown or changed key aborts the deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload the compose file and the nginx configuration
        run: |
          set -euo pipefail
          ssh deploy-target "mkdir -p '$DEPLOY_PATH'"
          scp -q docker-compose.yml "deploy-target:$DEPLOY_PATH/docker-compose.yml"
          scp -q nginx.conf "deploy-target:$DEPLOY_PATH/nginx.conf"

      - name: Deploy the new image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.package-version.outputs.version }}
          WEB_PORT: ${{ vars.DEPLOY_WEB_PORT || '3000' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):$VERSION"
          echo "Deploying $IMAGE to $DEPLOY_HOST:$DEPLOY_PATH"
          # The job token is only valid while this job runs; the host logs out right after
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target "docker login ghcr.io -u '$GHCR_USER' --password-stdin" >/dev/null
          ssh deploy-target sh -s -- "$DEPLOY_PATH" "$IMAGE" "$WEB_PORT" <<'REMOTE'
          set -eu
          cd "$1"
          export WEB_IMAGE="$2" FRONTEND_PORT="$3"
          docker network inspect saasfoundry-network >/dev/null 2>&1 || docker network create saasfoundry-network >/dev/null
          docker compose pull frontend
          docker compose up -d --no-build frontend
          for attempt in $(seq 1 24); do
            status=$(docker inspect -f '{{.State.Health.Status}}' saasfoundry-web)
            if [ "$status" = healthy ]; then
              echo "saasfoundry-web is healthy"
              docker image prune -f >/dev/null
              exit 0
            fi
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker compose logs --tail 100 frontend
          echo "saasfoundry-web did not become healthy" >&2
          exit 1
          REMOTE

      - name: Log the host out of the registry
        if: always()
        run: ssh deploy-target "docker logout ghcr.io" >/dev/null 2>&1 || true
