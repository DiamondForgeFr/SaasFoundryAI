name: Tests

on:
  push:
    branches: {{CI_PUSH_BRANCHES_JSON}}
    tags: ['v*', 'rc-*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: {{CI_PR_BRANCHES_JSON}}
  merge_group:
    types: [checks_requested]
    branches: {{CI_PR_BRANCHES_JSON}}
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    name: CI / Classify impact
    runs-on: ubuntu-latest
    outputs:
      contract_version: ${{ steps.classify.outputs.contract_version }}
      mode: ${{ steps.classify.outputs.mode }}
      execute: ${{ steps.classify.outputs.execute }}
      full: ${{ steps.classify.outputs.full }}
      guards: ${{ steps.classify.outputs.guards }}
      docs: ${{ steps.classify.outputs.docs }}
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      shared: ${{ steps.classify.outputs.shared }}
      harness_scaffold: ${{ steps.classify.outputs.harness_scaffold }}
      lifecycle: ${{ steps.classify.outputs.lifecycle }}
      reason_code: ${{ steps.classify.outputs.reason_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: resolve
        name: Resolve trusted range and policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          MAIN_BRANCH: {{VALIDATION_MAIN_BRANCH_JSON}}
        run: |
          set -euo pipefail
          base="$SHA"
          head="$SHA"
          range_mode="two-dot"
          force_full="false"
          force_reason="EVENT_FORCED_FULL"
          deferred="false"
          trusted_base=""

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              range_mode="three-dot"
              trusted_base="$PR_BASE_SHA"
              if [[ "$PR_DRAFT" == "true" ]]; then deferred="true"; fi
              if [[ "$PR_BASE_REF" == "$MAIN_BRANCH" ]]; then
                force_full="true"
                force_reason="RELEASE_TARGET_FULL"
              fi
              ;;
            merge_group)
              base="$GROUP_BASE_SHA"
              head="$GROUP_HEAD_SHA"
              trusted_base="$GROUP_BASE_SHA"
              if [[ "$GROUP_BASE_REF" == "refs/heads/$MAIN_BRANCH" || "$GROUP_BASE_REF" == "$MAIN_BRANCH" ]]; then
                force_full="true"
                force_reason="RELEASE_TARGET_FULL"
              fi
              ;;
            push)
              base="$PUSH_BEFORE"
              head="$SHA"
              if [[ "$REF" == "refs/heads/$MAIN_BRANCH" || "$REF" == refs/heads/rc-* || "$REF" == refs/tags/v* || "$REF" == refs/tags/rc-* ]]; then
                force_full="true"
                force_reason="RELEASE_EVENT_FULL"
              fi
              ;;
            schedule|workflow_dispatch)
              force_full="true"
              force_reason="EVENT_FORCED_FULL"
              ;;
            *)
              force_full="true"
              force_reason="UNKNOWN_EVENT_FULL"
              ;;
          esac

          classifier="$GITHUB_WORKSPACE/scripts/saasfoundry/impact-classifier.mjs"
          if [[ -n "$trusted_base" ]]; then
            classifier="$RUNNER_TEMP/impact-classifier.mjs"
            if ! git show "${trusted_base}:scripts/saasfoundry/impact-classifier.mjs" > "$classifier"; then
              classifier=""
            fi
          fi

          {
            echo "base=$base"
            echo "head=$head"
            echo "range_mode=$range_mode"
            echo "force_full=$force_full"
            echo "force_reason=$force_reason"
            echo "deferred=$deferred"
            echo "classifier=$classifier"
          } >> "$GITHUB_OUTPUT"

      - id: classify
        name: Classify impact from the trusted contract
        shell: bash
        env:
          BASE: ${{ steps.resolve.outputs.base }}
          HEAD_SHA: ${{ steps.resolve.outputs.head }}
          RANGE_MODE: ${{ steps.resolve.outputs.range_mode }}
          FORCE_FULL: ${{ steps.resolve.outputs.force_full }}
          FORCE_REASON: ${{ steps.resolve.outputs.force_reason }}
          DEFERRED: ${{ steps.resolve.outputs.deferred }}
          CLASSIFIER: ${{ steps.resolve.outputs.classifier }}
        run: |
          set -euo pipefail
          if [[ -z "$CLASSIFIER" || ! -s "$CLASSIFIER" ]]; then
            if [[ "$DEFERRED" == "true" ]]; then
              mode="deferred"
              execute="false"
              selected="false"
            else
              mode="fallback-full"
              execute="true"
              selected="true"
            fi
            {
              echo "contract_version=1"
              echo "mode=$mode"
              echo "execute=$execute"
              echo "full=true"
              echo "guards=$selected"
              echo "docs=$selected"
              echo "frontend=false"
              echo "backend=false"
              echo "shared=$selected"
              echo "harness_scaffold=$selected"
              echo "lifecycle=$selected"
              echo "reason_code=TRUSTED_CLASSIFIER_UNAVAILABLE_FULL"
            } >> "$GITHUB_OUTPUT"
            echo "Trusted-base classifier unavailable; selecting the full validation command."
            exit 0
          fi

          args=(--profile {{VALIDATION_PROFILE}} --base "$BASE" --head "$HEAD_SHA" --range-mode "$RANGE_MODE" --github-output "$GITHUB_OUTPUT")
          if [[ "$FORCE_FULL" == "true" ]]; then args+=(--force-full --force-reason "$FORCE_REASON"); fi
          if [[ "$DEFERRED" == "true" ]]; then args+=(--deferred); fi
          node "$CLASSIFIER" "${args[@]}"

  validate:
    name: CI / Impact validation
    needs: classify
    if: >-
      needs.classify.outputs.execute == 'true' &&
      (needs.classify.outputs.guards == 'true' || needs.classify.outputs.docs == 'true' ||
       needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true' ||
       needs.classify.outputs.shared == 'true' || needs.classify.outputs.harness_scaffold == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-warnings
        env:
          SF_SKIP_PLAYWRIGHT_INSTALL: '1'
      - name: Minimal safety guards
        if: needs.classify.outputs.guards == 'true'
        run: npm run test:impact:guards
      - name: Documentation validation
        if: needs.classify.outputs.docs == 'true'
        run: npm run test:impact:docs
      - name: Frontend validation
        if: needs.classify.outputs.frontend == 'true'
        run: npm run test:impact:frontend
      - name: Backend validation
        if: needs.classify.outputs.backend == 'true'
        run: npm run test:impact:backend
      - name: Shared-contract validation
        if: needs.classify.outputs.shared == 'true'
        run: npm run test:impact:shared
      - name: Harness validation
        if: needs.classify.outputs.harness_scaffold == 'true'
        run: npm run test:impact:harness

  lifecycle:
    name: CI / Lifecycle validation
    needs: classify
    if: needs.classify.outputs.execute == 'true' && needs.classify.outputs.lifecycle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-warnings
      - name: Lifecycle validation
        run: npm run test:impact:lifecycle

  required_gate:
    name: CI / Required gate
    needs: [classify, validate, lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the requested validation plan completed
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CONTRACT_VERSION: ${{ needs.classify.outputs.contract_version }}
          EXECUTE: ${{ needs.classify.outputs.execute }}
          FULL: ${{ needs.classify.outputs.full }}
          GUARDS: ${{ needs.classify.outputs.guards }}
          DOCS: ${{ needs.classify.outputs.docs }}
          FRONTEND: ${{ needs.classify.outputs.frontend }}
          BACKEND: ${{ needs.classify.outputs.backend }}
          SHARED: ${{ needs.classify.outputs.shared }}
          HARNESS_SCAFFOLD: ${{ needs.classify.outputs.harness_scaffold }}
          LIFECYCLE: ${{ needs.classify.outputs.lifecycle }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          MODE: ${{ needs.classify.outputs.mode }}
          REASON_CODE: ${{ needs.classify.outputs.reason_code }}
        run: |
          set -euo pipefail
          failed=0

          expect_result() {
            local label="$1" expected="$2" actual="$3"
            local wanted="skipped"
            if [[ "$expected" == "true" ]]; then wanted="success"; fi
            printf '%-24s expected=%-8s actual=%s\n' "$label" "$wanted" "$actual"
            if [[ "$actual" != "$wanted" ]]; then failed=1; fi
          }

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Classifier result is $CLASSIFY_RESULT, expected success."
            failed=1
          fi
          if [[ "$CONTRACT_VERSION" != "1" ]]; then
            echo "Unsupported or missing classifier contract: $CONTRACT_VERSION"
            failed=1
          fi
          for value in "$EXECUTE" "$FULL" "$GUARDS" "$DOCS" "$FRONTEND" "$BACKEND" "$SHARED" "$HARNESS_SCAFFOLD" "$LIFECYCLE"; do
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "Malformed boolean output: $value"
              failed=1
            fi
          done

          validate_expected="false"
          if [[ "$EXECUTE" == "true" && ("$GUARDS" == "true" || "$DOCS" == "true" || "$FRONTEND" == "true" || "$BACKEND" == "true" || "$SHARED" == "true" || "$HARNESS_SCAFFOLD" == "true") ]]; then
            validate_expected="true"
          fi
          lifecycle_expected="false"
          if [[ "$EXECUTE" == "true" && "$LIFECYCLE" == "true" ]]; then lifecycle_expected="true"; fi

          expect_result "impact validation" "$validate_expected" "$VALIDATE_RESULT"
          expect_result "lifecycle validation" "$lifecycle_expected" "$LIFECYCLE_RESULT"

          echo "Mode: $MODE — reason: $REASON_CODE"
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::The impact-aware validation plan did not complete."
            exit 1
          fi
          echo "Validation plan completed successfully."
